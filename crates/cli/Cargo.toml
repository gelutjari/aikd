[package]
name = "aikd-cli"
version.workspace = true
edition.workspace = true
description = "AIKD CLI interface"

[[bin]]
name = "aikd"
path = "src/main.rs"

[[bin]]
name = "aikd-tray"
path = "src/tray.rs"
required-features = ["tray"]

[features]
default = []
tray = ["dep:tray-icon", "dep:muda", "dep:winit"]
semantic = ["aikd-embedder/semantic"]
semantic-ext = ["aikd-embedder/semantic-ext"]

[dependencies]
aikd-core = { path = "../core" }
aikd-storage = { path = "../storage" }
aikd-indexer = { path = "../indexer" }
aikd-embedder = { path = "../embedder" }
aikd-chunker = { path = "../chunker" }
aikd-session = { path = "../session" }
aikd-context = { path = "../context" }
aikd-server = { path = "../server" }
aikd-watcher = { path = "../watcher" }
aikd-benchmark = { path = "../benchmark" }
aikd-scanner = { path = "../scanner" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
shellexpand = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tracing-subscriber = { workspace = true }
num_cpus = "1"
indicatif = { workspace = true }
rayon = { workspace = true }
sysinfo = { workspace = true }
tray-icon = { version = "=0.21.3", optional = true }
muda = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
